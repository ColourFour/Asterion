<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asterion Study</title>
  </head>
  <body>
    <script>
      (function () {
        var routeRoots = {
          "topics": true,
          "regions": true,
          "exam-training": true,
          "student": true,
          "teacher": true,
          "admin": true,
          "dashboard": true,
          "ui-review": true,
          "class-hall": true,
          "classHall": true
        };
        var path = window.location.pathname;
        var parts = path.split("/").filter(Boolean);
        var base = "/";
        if (parts.length && !routeRoots[parts[0]]) {
          base = "/" + parts[0] + "/";
        }
        window.sessionStorage.setItem("asterion.spa.redirect", window.location.href);
        window.location.replace(base);
      })();
    </script>
  </body>
</html>
